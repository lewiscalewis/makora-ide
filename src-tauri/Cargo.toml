[package]
name = "makora"
version = "0.1.0"
description = "MakoraIDE - agentic development IDE"
authors = ["Makora"]
edition = "2021"

[lib]
name = "makora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tiktoken-rs = "0.6"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
portable-pty = "0.8"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "macros"] }
keyring = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"
regex = "1.10"
ignore = "0.4"
html2md = "0.2"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
